name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the visual diff builds the previous revision
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: .venv/bin/ruff check --output-format github .
      - run: .venv/bin/pytest -q
      - name: build all styles (OTF, TTF, WOFF2; hinted and with STAT, as make builds them)
        run: make fonts
      - name: audit OpenType features
        run: .venv/bin/python -I scripts/feature_audit.py fonts/otf/*.otf
      - name: render specimen proofs
        run: .venv/bin/python -I scripts/proof_svg.py fonts/otf/*.otf --out build/proofs/ci
      - name: libraries Skia needs (visual diff)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1
      - name: visual diff against the previous revision
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1)
          fi
          make visual VISUAL_REF="$BASE"
      - name: compare spacing and kerning
        run: |
          set -euo pipefail
          mkdir -p build/quality
          .venv/bin/python -I scripts/quality/fetch_refs.py
          for style in Regular Italic Bold BoldItalic; do
            .venv/bin/python -I scripts/quality/pairs.py "$style" \
              > "build/quality/pairs-${style}.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fonts-and-proofs
          path: |
            fonts/
            build/proofs/ci/
            build/quality/pairs-*.txt
            build/visual/report/
