name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: .venv/bin/pytest -q
      - name: build fonts
        run: |
          .venv/bin/fontmake -u sources/MyiaDidot-Regular.ufo -o otf --output-dir fonts/otf
      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: fonts/
