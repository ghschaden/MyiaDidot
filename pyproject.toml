[project]
name = "myia-didot"
version = "0.1.0"
description = "Myia Didot: an extended-coverage fork of Theano Didot"
requires-python = ">=3.11"
dependencies = [
    "fonttools[ufo,lxml,unicode,woff]>=4.60",
    "fontmake>=3.10",
    "ufo2ft>=3.6",
    "ufoLib2>=0.17",
    "fontParts>=0.12",
    "ufonormalizer>=0.6",
    "uharfbuzz>=0.50",
    "fontbakery>=1.0",
    "gftools>=0.9.80",
    "glyphsets>=1.0",
    "hyperglot>=0.7",
    "shaperglot>=1.0",
    "diffenator2>=0.4",
    "pytest>=8",
    "pytest-xdist>=3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
