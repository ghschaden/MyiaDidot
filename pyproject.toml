[project]
name = "myia-didot"
version = "0.1.0"
description = "Myia Didot: an extended-coverage fork of Theano Didot"
requires-python = ">=3.11"
dependencies = [
    "fonttools[ufo,lxml,unicode,woff]>=4.60",
    "fontmake>=3.10",
    "ufo2ft>=3.6",
    "ufoLib2>=0.17",
    "fontParts>=0.12",
    "ufonormalizer>=0.6",
    "uharfbuzz>=0.50",
    "fontbakery>=1.0",
    "gftools>=0.9.80",
    "glyphsets>=1.0",
    "hyperglot>=0.7",
    "shaperglot>=1.0",
    "diffenator2>=0.4",
    "pytest>=8",
    "pytest-xdist>=3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120  # only for import wrapping: E501 is not checked
extend-exclude = ["sources"]

[tool.ruff.lint]
# Lint only: no formatter, the recipe tables are aligned by hand.
select = ["F", "E4", "E7", "E9", "B", "I", "UP", "ISC", "EXE"]
ignore = [
    "E402",   # imports after sys.path.insert
    "E702",   # pen.moveTo(...); pen.lineTo(...) on one line
    "E741",   # l for left, as in the font tools
    "B905",   # zip() without strict=
    "UP031",  # %-formatting in the TeX and SVG generators, braces stay literal
    "ISC001",  # rf"..." "\n" joined on purpose (udhr_book)
]

[tool.ruff.lint.isort]
lines-after-imports = -1

[dependency-groups]
dev = [
    "ruff>=0.16",
]
